; =============================================================================
; pytest configuration for FundaIA
; -----------------------------------------------------------------------------
; - testpaths: pytest descobre apenas em tests/.
; - python_files / python_classes / python_functions: convencao padrao.
; - addopts: -ra mostra resumo de skips/xfails; --strict-markers evita
;            tipos errados; -q reduz ruido.
; - filterwarnings: silencia DeprecationWarning de scikit-learn / mealpy
;                   que sao ruido externo durante a Sprint 2.
; =============================================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
markers =
    smoke: testes rapidos de fumaca
    regression: testes de regressao numerica do comportamento atual
    engineering: testes das funcoes da camada de engenharia
    optimization: testes da camada de otimizacao (EGO, GA, GWO)
    benchmark: testes das funcoes benchmark de otimizacao
